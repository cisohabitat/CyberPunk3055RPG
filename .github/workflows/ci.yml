name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Require README and agent guide updates
        run: node scripts/docs-freshness.mjs
      - run: npm ci
      - name: Audit dependency vulnerabilities
        run: npm run security:audit
      - run: npm test
      - name: Audit gameplay balance
        run: npm run balance:audit
      - name: Compare matched mission objectives
        run: npm run balance:missions
      - name: Check goal-driven campaign economy
        run: npm run balance:campaigns
      - name: Check overlapping clinic and witness work
        run: npm run balance:overlap
      - name: Upload gameplay balance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gameplay-balance
          path: qa/production/reports/balance/
          if-no-files-found: error
          retention-days: 30

  browser:
    name: Browser (${{ matrix.project }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, phone, firefox, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Start virtual audio device
        run: |
          sudo apt-get install -y pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=saint_shard_ci
          pactl set-default-sink saint_shard_ci
      - run: npm run build
      - run: npm run production:report
      - run: npm run production:verify
        if: matrix.project == 'chromium'
      - name: Check native menu permission before campaign regressions
        if: matrix.project == 'chromium'
        run: npm run test:browser -- tests/menu-autoplay-policy.spec.ts --project chromium --workers=1
      - name: Check all speaker captions before campaign regressions
        run: npm run test:browser -- tests/speaker-presentation.spec.ts --grep "all actors identify" --project=${{ matrix.project }} --workers=4
      - run: npm run test:browser -- --project=${{ matrix.project }} --workers=4
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-evidence-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-evidence-${{ matrix.project }}
          path: qa/production/reports/
          retention-days: 30

  build:
    name: Build
    if: ${{ always() }}
    needs: [test, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Require source tests and every browser project
        env:
          TEST_RESULT: ${{ needs.test.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: node scripts/require-browser-checks.mjs
